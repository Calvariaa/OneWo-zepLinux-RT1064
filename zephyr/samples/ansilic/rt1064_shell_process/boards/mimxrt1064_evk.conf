# Extra Kconfig for the i.MX RT1064 build.
#
# Zephyr appends <application>/boards/<board>.conf automatically when building
# for that board, so nothing here reaches any other target - prj.conf stays
# exactly as the other boards expect it.
#
# Everything below is for the microSD socket on the RT1064 core board, which the
# sd_commands.c shell commands use.

# Raw block layer. disk_access_* backs sdtest/sdwipe and is what FATFS reads and
# writes through.
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_SDHC=y

# ELM FAT filesystem on top of the block layer.
CONFIG_FAT_FILESYSTEM_ELM=y

# FILE_SYSTEM_MKFS pulls in fs_mkfs(); FS_FATFS_MKFS only enables the formatter
# inside FatFS itself. Both are needed for `sdclear format` and `sdwipe`.
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FS_FATFS_MKFS=y
CONFIG_FS_FATFS_MOUNT_MKFS=n

# Long file names. Without this FatFS accepts only 8.3 short names, so an
# ordinary name like "HELLOWORLD" fails with FR_INVALID_NAME, which the FS layer
# surfaces as the rather opaque -ENOENT (-2).
# HEAP mode gives each call its own buffer, so it is safe with the command
# processes and the SD hotplug thread running concurrently; BSS mode reuses one
# static buffer and is documented as not thread-safe.
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_HEAP=y

# FATFS work areas and directory objects come out of the system heap, and the
# hotplug thread needs a little room of its own.
CONFIG_HEAP_MEM_POOL_SIZE=49152
